name: laptop-video-transcribe
services:
  app:
    build: .
    container_name: laptop-video-transcribe-app
    ports:
      - "127.0.0.1:${APP_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /data
      MODEL_CACHE_DIR: /cache/whisper
      APP_HOST: 0.0.0.0
      APP_PORT: 7860
    volumes:
      - ./data:/data
      - ./cache/whisper:/cache/whisper
      - ./cache/huggingface:/cache/huggingface
    shm_size: 2gb
    gpus: all
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: laptop-video-transcribe-ollama
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
volumes:
  ollama_models:
